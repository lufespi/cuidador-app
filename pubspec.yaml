name: cuidador_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Ícones e utilidades
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  mask_text_input_formatter: ^2.9.0
  flutter_svg: ^2.0.10

  # Persistência e estado
  shared_preferences: ^2.5.3
  provider: ^6.1.5+1

  # HTTP
  http: ^1.2.2

  # Gráficos e arquivos
  fl_chart: ^0.69.0
  path_provider: ^2.1.1
  open_file: ^3.3.2

  # 🚀 Notificações locais (adição necessária)
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/cuidador-main-logo.png
    - assets/images/cuidador-horizontal-logo.png
    - assets/images/body-image.png
    - assets/images/doctor.png
    - assets/images/old-woman.png
    - assets/images/woman-exercise.png
    - assets/images/cuidador-icon.png
    - assets/images/figma.png
    - assets/images/github-logo.png
    - assets/images/flutter-logo.png
    - assets/images/python.png
    - assets/images/pythonanywhere.png
    - assets/images/trello.png
    - assets/images/lufespi.jpg

    # Body Parts
    - assets/images/body-parts/Body.png
    - assets/images/body-parts/Head.png
    - assets/images/body-parts/Left-Arm.png
    - assets/images/body-parts/Left-Foot.png
    - assets/images/body-parts/Left-Hand.png
    - assets/images/body-parts/Left-Leg.png
    - assets/images/body-parts/Right-Arm.png
    - assets/images/body-parts/Right-Foot.png
    - assets/images/body-parts/Right-Hand.png
    - assets/images/body-parts/Right-Leg.png
    - assets/images/body-parts/Torso.png

    # Icons SVG
    - assets/icons/navigation-bar/activity.svg
    - assets/icons/navigation-bar/bell.svg
    - assets/icons/navigation-bar/book-open.svg
    - assets/icons/navigation-bar/heart.svg
    - assets/icons/navigation-bar/settings.svg

    # Accessibility Icons
    - assets/icons/accessibility/constract.svg
    - assets/icons/accessibility/person-standing.svg
    - assets/icons/accessibility/speaker.svg
    - assets/icons/accessibility/T-font.svg

    # Education Icons
    - assets/icons/education/book.svg

    # Forms Icons
    - assets/icons/forms/calendar-days.svg
    - assets/icons/forms/constrast.svg
    - assets/icons/forms/heart-pulse.svg
    - assets/icons/forms/person-standing.svg
    - assets/icons/forms/shield.svg
    - assets/icons/forms/speaker.svg
    - assets/icons/forms/T-font.svg
    - assets/icons/forms/user-pen.svg

    # Pain Icons
    - assets/icons/pain/activity.svg
    - assets/icons/pain/calendar.svg
    - assets/icons/pain/locate-fixed.svg
    - assets/icons/pain/stethoscope.svg

    # Practice Icons
    - assets/icons/practice/clock.svg
    - assets/icons/practice/dumbbell.svg
    - assets/icons/practice/footprints.svg
    - assets/icons/practice/heart.svg
    - assets/icons/practice/sparkles.svg
    - assets/icons/practice/triangle-alert.svg
    - assets/icons/practice/wind.svg

    # Reminder Icons
    - assets/icons/reminder/bell.svg
    - assets/icons/reminder/clock.svg
    - assets/icons/reminder/pen-line.svg
    - assets/icons/reminder/plus.svg

    # Settings Icons
    - assets/icons/settings/bell-ring.svg
    - assets/icons/settings/globe.svg
    - assets/icons/settings/info.svg
    - assets/icons/settings/lock-keyhole.svg
    - assets/icons/settings/palette.svg
    - assets/icons/settings/person-standing.svg
    - assets/icons/settings/settings.svg
    - assets/icons/settings/user-round.svg
    - assets/icons/settings/brazil-flag.svg
    - assets/icons/settings/us-flag.svg
    - assets/icons/settings/spain-flag.svg
    
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
        - asset: assets/fonts/Inter-Italic-VariableFont_opsz,wght.ttf
          style: italic
